[runner]
user = runner
group = runner
listen.owner = runner
listen.group = runner
listen.mode = 0666
listen = /run/php/php{VersionNumber}-fpm-runner.sock
pm = dynamic
pm.start_servers = 2
pm.max_children = 5
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Keep PHP errors out of tracker HTTP responses so they don't corrupt the
; GIF beacon that fixtures assert on (php-di emits deprecations on PHP 8.4+).
; Errors are still recorded via log_errors -> php-errors.log.
php_admin_flag[display_errors] = Off
php_admin_flag[log_errors] = On
